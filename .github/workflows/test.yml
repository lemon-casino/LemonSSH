name: test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            experiments/wails-shell-probe/go.sum
            experiments/terminal-data-plane/go.sum
            go.sum
            experiments/profile-secret-migration/go.sum

      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fish xvfb libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify generated Catty tool specs
        run: |
          npm run generate:capability-tools
          git diff --exit-code infrastructure/ai/harness/generated/cattyToolSpecs.json

      - name: Verify plugin contract codegen drift
        run: npm run check:plugin-contract

      - name: Verify Codex App Server schema
        run: npm run check:codex-app-server-schema

      - name: Verify Wails migration documentation
        run: npm run check:migration-docs

      - name: Verify base contracts and data inventory
        run: |
          npm run check:contracts
          npm run check:data-inventory
          npm run check:plugin-retention

      - name: Verify transactional profile store
        run: npm run check:profile-store

      - name: Verify platform credential providers
        run: npm run check:credentials

      - name: Verify Wails shell probe
        run: npm run check:wails-shell-probe

      - name: Verify terminal data-plane probe
        run: npm run check:terminal-data-plane-probe

      - name: Verify secret migration probe
        run: npm run check:secret-migration-probe

      - name: Test Go owners
        run: go test ./internal/... ./cmd/...

      - name: Test
        run: npm test

      - name: Build Wails frontend
        run: npm run build

      - name: Embed frontend and build Wails shell
        run: |
          node scripts/wails-prepare-frontend.mjs
          go build -o /tmp/lemonssh-ci ./cmd/netcatty
