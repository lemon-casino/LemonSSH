name: wails-package

# Unsigned Wails qualification binaries only. No Authenticode, notarization,
# or installer formats. The operator self-signs later.
# Push to main uploads Actions artifacts. A v* tag also publishes a GitHub
# Release with the same unsigned zip files.

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: wails-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  package:
    name: Unsigned Wails binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install deps
        run: npm ci

      - name: Fetch host mosh-client
        continue-on-error: true
        run: npm run fetch:mosh:dev

      - name: Package unsigned Wails binary
        run: node scripts/package-wails.mjs

      - name: Record unsigned Authenticode status
        if: runner.os == 'Windows'
        shell: bash
        run: |
          artifact=$(ls dist/wails/LemonSSH-*.exe | head -1)
          node scripts/sign-wails-probe.mjs --artifact "$artifact"

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lemonssh-${{ matrix.os }}
          path: dist/wails/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish unsigned GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: lemonssh-windows-latest
          path: release/lemonssh-windows-latest

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: lemonssh-macos-latest
          path: release/lemonssh-macos-latest

      - name: Download Ubuntu artifact
        uses: actions/download-artifact@v7
        with:
          name: lemonssh-ubuntu-latest
          path: release/lemonssh-ubuntu-latest

      - name: Zip platform folders
        run: |
          cd release
          zip -r lemonssh-windows-latest.zip lemonssh-windows-latest
          zip -r lemonssh-macos-latest.zip lemonssh-macos-latest
          zip -r lemonssh-ubuntu-latest.zip lemonssh-ubuntu-latest

      - name: Publish unsigned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/lemonssh-windows-latest.zip
            release/lemonssh-macos-latest.zip
            release/lemonssh-ubuntu-latest.zip
          body: |
            Unsigned Wails qualification binaries. Self-sign before public distribution.
            No Authenticode, notarization, or installer formats.
